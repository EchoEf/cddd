<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ 工会战伤害统计</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e5e8f0;
    --accent: #5b6ee8;
    --gold: linear-gradient(135deg, #f7c948 0%, #e8a317 100%);
    --silver: linear-gradient(135deg, #cfd6e4 0%, #a9b4c9 100%);
    --bronze: linear-gradient(135deg, #e0a370 0%, #b97a45 100%);
    --red-bg: #fdecea;
    --red-border: #f5c6c0;
    --red-text: #c0392b;
    --water-bg: linear-gradient(135deg, #e3f2fd 0%, #d0ebff 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background:
      radial-gradient(1100px 520px at 8% -8%, #e3e9ff 0%, rgba(227,233,255,0) 60%),
      radial-gradient(900px 480px at 108% 6%, #ffeef3 0%, rgba(255,238,243,0) 55%),
      radial-gradient(900px 560px at 50% 112%, #e2f9f0 0%, rgba(226,249,240,0) 60%),
      #f6f7fc;
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }
  ::selection { background: rgba(91,110,232,.2); }
  .container { max-width: 1120px; margin: 0 auto; }

  /* 顶部横幅：毛玻璃卡片 + 流光效果 */
  .header {
    position: relative;
    text-align: center;
    margin-bottom: 22px;
    padding: 30px 20px 26px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 10px 34px rgba(91,110,232,.12);
    backdrop-filter: blur(10px);
    overflow: hidden;
  }
  .header::before {
    content: "";
    position: absolute;
    top: -70%;
    left: -40%;
    width: 50%;
    height: 240%;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.6) 50%, transparent 80%);
    transform: rotate(12deg);
    animation: shine 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0%, 55%, 100% { left: -40%; }
    25%, 35% { left: 115%; }
  }
  .header h1 {
    font-size: 30px;
    font-weight: 800;
    background: linear-gradient(90deg, #5b6ee8, #9b59b6 45%, #e8734a);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 2px;
    animation: hue 8s linear infinite;
  }
  @keyframes hue {
    to { background-position: 200% center; }
  }
  .header .subtitle { color: var(--muted); margin-top: 8px; font-size: 14px; letter-spacing: 1px; }

  /* 前三名领奖台 */
  .podium {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  .podium-card {
    position: relative;
    border-radius: 16px;
    padding: 16px 12px 16px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: 0 4px 18px rgba(31,36,48,.08);
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
  }
  .podium-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px rgba(31,36,48,.15); }
  .podium-card::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 4px;
  }
  .podium-card .medal { font-size: 32px; line-height: 1; filter: drop-shadow(0 3px 6px rgba(0,0,0,.18)); }
  .podium-card .name { font-weight: 800; font-size: 16px; margin-top: 7px; }
  .podium-card .score { font-weight: 800; font-size: 21px; margin-top: 2px; }
  .podium-card .best { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .podium-card.p1 { background: linear-gradient(180deg, #fffdf3 0%, #fff4d6 100%); border-color: #f0dfae; }
  .podium-card.p1 .score { color: #b26a00; }
  .podium-card.p1::after { background: var(--gold); }
  .podium-card.p2 { background: linear-gradient(180deg, #fbfcff 0%, #eff2f9 100%); border-color: #d5dcec; }
  .podium-card.p2 .score { color: #5a6a86; }
  .podium-card.p2::after { background: var(--silver); }
  .podium-card.p3 { background: linear-gradient(180deg, #fdf8f3 0%, #f7ebdb 100%); border-color: #ead3ba; }
  .podium-card.p3 .score { color: #a06235; }
  .podium-card.p3::after { background: var(--bronze); }

  /* 玩家搜索框 */
  .toolbar {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }
  .toolbar input {
    width: min(380px, 100%);
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.92);
    box-shadow: 0 2px 10px rgba(31,36,48,.07);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .toolbar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,110,232,.15);
  }
  .toolbar input::placeholder { color: #a6afc4; }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  .stat-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    box-shadow: 0 2px 10px rgba(31,36,48,.06);
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
  }
  .stat-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #5b6ee8, #9b59b6);
  }
  .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(31,36,48,.13); }
  .stat-card .num {
    font-size: 25px;
    font-weight: 800;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .stat-card .label { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .stat-card.warn::before { background: linear-gradient(90deg, #e8734a, #d64545); }
  .stat-card.warn .num { color: var(--red-text); }

  .legend {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; }

  .table-wrap {
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(31,36,48,.08);
    overflow: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 820px; font-variant-numeric: tabular-nums; }
  thead th {
    background: linear-gradient(180deg, #f9fafe 0%, #edf0f9 100%);
    padding: 13px 12px;
    font-weight: 700;
    font-size: 13px;
    color: #3d4557;
    white-space: nowrap;
    border-bottom: 2px solid #dfe4f0;
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s;
  }
  thead th:hover { background: #e6eaf7; color: var(--accent); }
  thead th .arrow { font-size: 11px; color: var(--accent); margin-left: 4px; }
  tbody td {
    padding: 11px 12px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr { transition: background .15s, box-shadow .15s; animation: rowIn .35s ease both; }
  @keyframes rowIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  tbody tr:nth-child(even) { background: #fafbfe; }
  tbody tr:hover { background: rgba(91,110,232,.07); }
  tbody tr:last-child td { border-bottom: none; }

  /* 前三名行底色微调（跟随排序移动） */
  tbody tr.top1 { background: linear-gradient(90deg, #fff8e3 0%, #fffdf6 100%); }
  tbody tr.top2 { background: linear-gradient(90deg, #f4f6fb 0%, #fdfeff 100%); }
  tbody tr.top3 { background: linear-gradient(90deg, #fcf2e8 0%, #fffaf5 100%); }
  tbody tr.top1:hover, tbody tr.top2:hover, tbody tr.top3:hover { filter: brightness(.985); }

  /* 缺刀红底 */
  tr.incomplete { background: var(--red-bg); }
  tr.incomplete:hover { background: #fbdcd7; }
  tr.incomplete td { border-bottom-color: var(--red-border); }
  .miss { color: #d9534f; font-weight: 600; }

  /* 排名徽章 */
  .rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    border-radius: 50%;
    font-weight: 700;
    color: #555;
    background: #eef1f8;
    font-size: 14px;
  }
  .rank.r1 { background: var(--gold); color: #7a5200; box-shadow: 0 2px 6px rgba(232,163,23,.4); }
  .rank.r2 { background: var(--silver); color: #4a5568; box-shadow: 0 2px 6px rgba(169,180,201,.4); }
  .rank.r3 { background: var(--bronze); color: #6b3e1d; box-shadow: 0 2px 6px rgba(185,122,69,.4); }

  .player { font-weight: 600; }
  .total { font-weight: 700; color: var(--accent); font-size: 15px; }

  .boss-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .boss-铁匠 { background: #e8eaf6; color: #4a55a2; }
  .boss-火神R { background: #fdecea; color: #c0392b; }
  .boss-青瓜 { background: #e8f7ec; color: #27763f; }
  .boss-重金属音乐 { background: #f3e8fd; color: #7b3fa0; }
  .boss-秘材H { background: #fff3e0; color: #b26a00; }

  /* 三刀水备注美化 */
  .water {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--water-bg);
    border: 1px solid #b3d9f5;
    color: #1a6fb5;
    font-weight: 600;
    font-size: 13px;
    animation: wave 2.4s ease-in-out infinite;
  }
  @keyframes wave {
    0%, 100% { box-shadow: 0 0 0 0 rgba(80,160,230,.25); }
    50% { box-shadow: 0 0 0 6px rgba(80,160,230,0); }
  }

  .incomplete-note {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #fdecea;
    border: 1px solid #f5c6c0;
    color: var(--red-text);
    font-weight: 600;
    font-size: 13px;
  }

  /* 上一期排名列 */
  .prev-rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 34px;
    padding: 3px 8px;
    border-radius: 8px;
    font-weight: 600;
    background: #f1f3f9;
    color: #4a5364;
  }
  .prev-new {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    background: linear-gradient(135deg, #fff9c4 0%, #fff176 100%);
    color: #7a6000;
    font-weight: 700;
    font-size: 12px;
  }

  /* 备注内排名变化小标签 */
  .note-change-up {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #e8f7ec;
    color: #207a3d;
    font-weight: 700;
    font-size: 12px;
  }
  .note-change-down {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #fdecea;
    color: #b93b2b;
    font-weight: 700;
    font-size: 12px;
  }
  .note-box {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .badge-mini {
    font-size: 11px;
    padding: 2px 7px;
    vertical-align: middle;
    margin-left: 4px;
  }

  /* 访问人数（低调显示） */
  .visitor-count {
    position: fixed;
    right: 12px;
    bottom: 12px;
    background: rgba(255,255,255,.88);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 11px;
    color: var(--muted);
    box-shadow: 0 1px 5px rgba(31,36,48,.08);
    backdrop-filter: blur(4px);
    z-index: 50;
    opacity: .85;
  }

  /* 回到顶部按钮（默认隐藏，移动端滚动后显示） */
  .back-to-top {
    display: none;
    position: fixed;
    right: 16px;
    bottom: 70px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,.96);
    border: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(31,36,48,.18);
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: var(--accent);
    cursor: pointer;
    z-index: 50;
    opacity: 0;
    transition: opacity .25s, transform .2s;
    transform: translateY(10px);
    backdrop-filter: blur(4px);
  }
  .back-to-top.show {
    display: flex;
    opacity: .95;
    transform: translateY(0);
  }
  .back-to-top:hover { background: #f6f8fe; transform: translateY(-2px); }

  @media (max-width: 768px) {
    .back-to-top.show { display: flex; }
  }

  /* 视图切换按钮 */
  .view-toggle {
    display: none;
    text-align: center;
    margin-bottom: 14px;
  }
  .view-toggle button {
    padding: 7px 18px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(31,36,48,.06);
  }
  .view-toggle button:hover { background: #f6f8fe; border-color: #c3cae0; }

  /* 滑动提示 */
  .scroll-hint {
    display: none;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 6px;
    background: #f8f9fd;
    border-bottom: 1px solid var(--border);
    transition: opacity .3s;
  }

  /* 卡片视图 */
  .card-list {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .player-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 14px 14px 19px;
    box-shadow: 0 2px 10px rgba(31,36,48,.06);
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
    animation: rowIn .35s ease both;
  }
  .player-card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, #5b6ee8, #9b59b6);
  }
  .player-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(31,36,48,.13); }
  .player-card.incomplete { background: var(--red-bg); border-color: var(--red-border); }
  .player-card.incomplete::before { background: linear-gradient(180deg, #e8734a, #d64545); }
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--border);
  }
  .card-header .player { flex: 1; font-weight: 700; font-size: 16px; }
  .card-header .total {
    font-weight: 800;
    font-size: 17px;
    background: linear-gradient(90deg, #5b6ee8, #9b59b6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .card-body {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 14px;
    font-size: 13px;
    align-items: center;
  }
  .card-row { display: contents; }
  .card-row > span:first-child { color: var(--muted); text-align: left; }
  .card-row > span:last-child { text-align: right; }
  .card-row .note-box { justify-content: flex-end; }
  .card-row .sugar-comment { text-align: right; max-width: none; }

  /* 糖王锐评 */
  .sugar-comment {
    display: inline-block;
    max-width: 260px;
    padding: 8px 12px;
    border-radius: 10px;
    background: linear-gradient(135deg, #fff8e1 0%, #ffecb3 100%);
    border: 1px solid #ffe082;
    color: #6d4c00;
    font-size: 13px;
    line-height: 1.55;
    text-align: left;
    white-space: normal;
    word-break: break-word;
    box-shadow: 0 1px 4px rgba(230,180,40,.15);
  }
  .sugar-comment::before { content: "🍬 "; }

  /* 移动端兼容 */
  @media (max-width: 768px) {
    body { padding: 12px; }
    .header { padding: 20px 12px 18px; border-radius: 16px; }
    .header h1 { font-size: 20px; letter-spacing: 1px; }
    .header .subtitle { font-size: 12px; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat-card { padding: 10px 8px; }
    .stat-card .num { font-size: 19px; }
    .stat-card .label { font-size: 12px; }
    .podium { gap: 8px; margin-bottom: 14px; }
    .podium-card { padding: 12px 6px 12px; border-radius: 12px; }
    .podium-card .medal { font-size: 24px; }
    .podium-card .name { font-size: 13px; }
    .podium-card .score { font-size: 16px; }
    .podium-card .best { font-size: 10px; }
    .legend { font-size: 11px; gap: 8px 12px; margin-bottom: 14px; }
    .view-toggle { display: block; }
    .scroll-hint { display: block; }
    .table-wrap { border-radius: 10px; }
    table { min-width: 900px; font-size: 12px; border-collapse: separate; border-spacing: 0; }
    thead th { padding: 8px 6px; font-size: 12px; }
    tbody td { padding: 8px 6px; }
    .rank { width: 26px; height: 26px; font-size: 12px; }
    .player { max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
    .sugar-comment { max-width: 180px; font-size: 12px; padding: 6px 9px; }
    .footer { font-size: 12px; }

    /* 表格视图下固定前3列，滑动时也能知道是谁 */
    thead th:nth-child(1), tbody td:nth-child(1) { position: sticky; left: 0; z-index: 2; background: #f8f9fd; }
    thead th:nth-child(2), tbody td:nth-child(2) { position: sticky; left: 38px; z-index: 2; background: #fff; }
    thead th:nth-child(3), tbody td:nth-child(3) { position: sticky; left: 86px; z-index: 2; background: #fff; }
    tbody tr:hover td:nth-child(1),
    tbody tr:hover td:nth-child(2),
    tbody tr:hover td:nth-child(3) { background: #f6f8fe; }
    tr.incomplete td:nth-child(1),
    tr.incomplete td:nth-child(2),
    tr.incomplete td:nth-child(3) { background: var(--red-bg); }
  }

  @media (max-width: 420px) {
    .header h1 { font-size: 18px; }
    .stats-bar { gap: 6px; }
    .stat-card { padding: 8px 6px; }
    .stat-card .num { font-size: 17px; }
    table { min-width: 820px; font-size: 11px; }
    .sugar-comment { max-width: 150px; font-size: 11px; }
  }

  .footer {
    margin-top: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }
  .footer .warn-box {
    background: var(--red-bg);
    border: 1px solid var(--red-border);
    border-radius: 12px;
    padding: 12px 20px;
    display: inline-block;
    text-align: left;
    color: var(--red-text);
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚔️ 工会战伤害统计 ⚔️</h1>
    <div class="subtitle">每人统计三刀 · 单位：亿 · 点击表头可排序 · 已对比上一期排名</div>
  </div>

  <div class="stats-bar">
    <div class="stat-card"><div class="num" id="stat-players">-</div><div class="label">👥 玩家总数</div></div>
    <div class="stat-card"><div class="num" id="stat-avg">-</div><div class="label">💥 平均总伤害</div></div>
    <div class="stat-card"><div class="num" id="stat-max">-</div><div class="label">🏆 最高总伤害</div></div>
    <div class="stat-card warn"><div class="num" id="stat-miss">-</div><div class="label">⚠️ 缺刀玩家</div></div>
  </div>

  <div class="podium" id="podium"></div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍 搜索玩家名 / 锐评关键词，快速定位" autocomplete="off">
  </div>

  <div class="legend">
    <span class="item"><span class="water">💧 三刀水</span> = 三刀均打铁匠</span>
    <span class="item"><span class="incomplete-note">🔴 缺刀</span> = 不足三刀（整行红底）</span>

const toYi = n => Math.round(n / 1e8 * 10) / 10;

// 预处理
const rows = data.map(r => {
  const totalRaw = r.hits.reduce((s, h) => s + h[1], 0);
  const isWater = r.hits.length === 3 && r.hits.every(h => h[0] === "铁匠");
  const lastRank = prevRank[r.player];
  return {
    player: r.player,
    hits: r.hits,
    totalRaw,
    totalYi: toYi(totalRaw),
    hitYi: r.hits.map(h => toYi(h[1])),
    isWater,
    count: r.hits.length,
    lastRank,
    sugarComment: sugarComments[r.player] || "",
  };
});

// 统计
const players = rows.length;
const avgYi = toYi(rows.reduce((s, r) => s + r.totalRaw, 0) / players);
const maxYi = Math.max(...rows.map(r => r.totalYi));
const missCount = rows.filter(r => r.count < 3).length;
document.getElementById("stat-players").textContent = players + " 人";
document.getElementById("stat-avg").textContent = avgYi + " 亿";
document.getElementById("stat-max").textContent = maxYi + " 亿";
document.getElementById("stat-miss").textContent = missCount + " 人";

// 前三名领奖台
(function renderPodium() {
  const medals = ["🥇", "🥈", "🥉"], cls = ["p1", "p2", "p3"];
  const top3 = [...rows].sort((a, b) => b.totalRaw - a.totalRaw).slice(0, 3);
  document.getElementById("podium").innerHTML = top3.map((r, i) => {
    const best = [...r.hits].sort((a, b) => b[1] - a[1])[0];
    return `<div class="podium-card ${cls[i]}">
      <div class="medal">${medals[i]}</div>
      <div class="name">${escHtml(r.player)}</div>
      <div class="score">${r.totalYi.toFixed(1)} 亿</div>
      <div class="best">最高一刀 ${toYi(best[1])} 亿 · ${escHtml(best[0])}</div>
    </div>`;
  }).join("");
})();

// 缺刀提示
const missRows = rows.filter(r => r.count < 3).sort((a, b) => a.count - b.count);
document.getElementById("warn-list").innerHTML =
  '<div class="warn-box">⚠️ 以下玩家刀数不足三刀，可补充缺失数据：<br>' +
  missRows.map(r => `&nbsp;&nbsp;• ${r.player}：当前 <b>${r.count}</b> 刀`).join("<br>") +
  "</div>";

// 排序状态
let sortKey = "total", sortAsc = false;
let searchTerm = ""; // 玩家搜索关键词
const tbody = document.getElementById("tbody");
const tableWrap = document.querySelector(".table-wrap");
const cardList = document.getElementById("card-list");
const viewToggleBtn = document.getElementById("view-toggle-btn");
// 默认视图：PC 用表格，手机用卡片；手动切换后会记住
let viewMode = localStorage.getItem("gvg_view_mode") || (window.innerWidth <= 768 ? "card" : "table");

function hitVal(r, idx) { return idx < r.hits.length ? r.hits[idx][1] : -1; }
function hitYiStr(r, idx) {
  if (idx >= r.hits.length) return '<span class="miss">— 缺</span>';
  const [boss, dmg] = r.hits[idx];
  const cls = "boss-" + boss.replace(/[^\u4e00-\u9fa5A-Za-z]/g, "");
  return `${toYi(dmg)}<span class="boss-tag ${cls}">${boss}</span>`;
}

function prevRankHtml(r, currentRank) {
  if (r.lastRank === undefined) return '<span class="prev-new">✨ 新</span>';
  const delta = r.lastRank - currentRank;
  let change = "";
  if (delta > 0) change = ` <span class="note-change-up">▲ 提升${delta}</span>`;
  else if (delta < 0) change = ` <span class="note-change-down">▼ 下降${-delta}</span>`;
  return `<span class="prev-rank">${r.lastRank}</span>${change}`;
}

function sugarHtml(text) {
  if (!text) return "—";
  return `<span class="sugar-comment">${escHtml(text)}</span>`;
}

function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function playerBadges(r) {
  if (r.isWater) return ' <span class="water badge-mini" title="三刀均打铁匠">💧</span>';
  if (r.count < 3) return ` <span class="incomplete-note badge-mini" title="缺 ${3 - r.count} 刀">🔴 缺${3 - r.count}</span>`;
  return "";
}

function render() {
  // 始终按总伤害排定名次徽章
  const byTotal = [...rows].sort((a, b) => b.totalRaw - a.totalRaw);
  const rankMap = new Map(byTotal.map((r, i) => [r.player, i + 1]));

  let sorted = [...rows];
  sorted.sort((a, b) => {
    let va, vb;
    switch (sortKey) {
      case "rank": case "total": va = a.totalRaw; vb = b.totalRaw; break;
      case "prev":
        // 上期排名值：未出现排在最后；值越大上期名次越低
        va = a.lastRank === undefined ? 999 : a.lastRank;
        vb = b.lastRank === undefined ? 999 : b.lastRank;
        break;
      case "player": va = a.player; vb = b.player; break;
      case "h1": va = hitVal(a,0); vb = hitVal(b,0); break;
      case "h2": va = hitVal(a,1); vb = hitVal(b,1); break;
      case "h3": va = hitVal(a,2); vb = hitVal(b,2); break;
      case "sugar": va = a.sugarComment; vb = b.sugarComment; break;
      default: va = a.totalRaw; vb = b.totalRaw;
    }
    let cmp;
    if (typeof va === "string") cmp = va.localeCompare(vb, "zh");
    else cmp = va - vb;
    return sortAsc ? cmp : -cmp;
  });

  // 搜索过滤（匹配玩家名或锐评内容）
  const visible = sorted.filter(r =>
    !searchTerm ||
    r.player.toLowerCase().includes(searchTerm) ||
    (r.sugarComment || "").toLowerCase().includes(searchTerm)
  );

  tbody.innerHTML = visible.map(r => {
    const rank = rankMap.get(r.player);
    const rankCls = rank === 1 ? "r1" : rank === 2 ? "r2" : rank === 3 ? "r3" : "";
    const incomplete = r.count < 3;
    const topCls = !incomplete && rank <= 3 ? " top" + rank : "";
    return `<tr class="${(incomplete ? "incomplete" : "") + topCls}">
      <td><span class="rank ${rankCls}">${rank}</span></td>
      <td>${prevRankHtml(r, rank)}</td>
      <td class="player">${r.player}${playerBadges(r)}</td>
      <td class="total">${r.totalYi.toFixed(1)}</td>
      <td>${hitYiStr(r,0)}</td>
      <td>${hitYiStr(r,1)}</td>
      <td>${hitYiStr(r,2)}</td>
      <td>${sugarHtml(r.sugarComment)}</td>
    </tr>`;
  }).join("");

  // 同时渲染卡片视图（可通过按钮切换）
  cardList.innerHTML = visible.map(r => {
    const rank = rankMap.get(r.player);
    const rankCls = rank === 1 ? "r1" : rank === 2 ? "r2" : rank === 3 ? "r3" : "";
    const incomplete = r.count < 3;
    return `
      <div class="player-card ${incomplete ? "incomplete" : ""}">
        <div class="card-header">
          <span class="rank ${rankCls}">${rank}</span>
          <span class="player">${r.player}${playerBadges(r)}</span>
          <span class="total">${r.totalYi.toFixed(1)}亿</span>
        </div>
        <div class="card-body">
          <div class="card-row"><span>上一期排名</span><span>${prevRankHtml(r, rank)}</span></div>
          <div class="card-row"><span>第一刀</span><span>${hitYiStr(r,0)}</span></div>
          <div class="card-row"><span>第二刀</span><span>${hitYiStr(r,1)}</span></div>
          <div class="card-row"><span>第三刀</span><span>${hitYiStr(r,2)}</span></div>
          <div class="card-row"><span>糖王锐评</span><span>${sugarHtml(r.sugarComment)}</span></div>
        </div>
      </div>
    `;
  }).join("");

  // 更新表头箭头
  document.querySelectorAll("#tbl thead th").forEach(th => {
    const arrow = th.querySelector(".arrow");
    arrow.textContent = th.dataset.key === sortKey ? (sortAsc ? "▲" : "▼") : "";
  });
}

document.querySelectorAll("#tbl thead th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = key === "player"; }
    render();
  });
});

// 玩家搜索：输入即过滤表格与卡片
document.getElementById("search").addEventListener("input", e => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

// 视图切换
function applyView() {
  if (viewMode === "card") {
    tableWrap.style.display = "none";
    cardList.style.display = "flex";
    viewToggleBtn.textContent = "📊 切换表格视图";
  } else {
    tableWrap.style.display = "";
    cardList.style.display = "none";
    viewToggleBtn.textContent = "📱 切换卡片视图";
  }
  localStorage.setItem("gvg_view_mode", viewMode);
}
viewToggleBtn.addEventListener("click", () => {
  viewMode = viewMode === "card" ? "table" : "card";
  applyView();
});

// 滑动提示：滚动后自动淡出
tableWrap.addEventListener("scroll", () => {
  const hint = document.getElementById("scroll-hint");
  if (hint) hint.style.opacity = "0";
}, { passive: true });

// 访问统计已改用不蒜子（busuanzi）真实计数服务，见页脚引入的脚本
// 页面浏览量显示在右下角：<span id="busuanzi_container_site_pv"> 内自动更新

// 回到顶部按钮（仅在移动端显示）
const backToTop = document.getElementById("back-to-top");
window.addEventListener("scroll", () => {
  if (window.innerWidth <= 768 && window.scrollY > 400) {
    backToTop.classList.add("show");
  } else {
    backToTop.classList.remove("show");
  }
}, { passive: true });
backToTop.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});

render();
applyView();
</script>
