<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ 工会战伤害统计</title>
<style>
  :root {
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e5e8f0;
    --red-bg: #fdecea;
    --red-border: #f5c6c0;
    --red-text: #c0392b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #f5f6f8;
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }
  ::selection { background: rgba(31,36,48,.08); }
  .container { max-width: 1120px; margin: 0 auto; }

  /* 顶部横幅 */
  .header {
    text-align: center;
    margin-bottom: 22px;
    padding: 26px 20px 24px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
  }
  .header .subtitle { color: var(--muted); margin-top: 8px; font-size: 14px; letter-spacing: 1px; }

  /* 期数切换 */
  .period-tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .ptab {
    padding: 8px 22px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .ptab:hover { border-color: #c9cfdd; }
  .ptab.active { background: var(--text); color: #fff; border-color: var(--text); }
  .ptab .ptag {
    display: inline-block;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 999px;
    margin-left: 6px;
    vertical-align: 1px;
    background: #eef0f4;
    color: var(--muted);
  }
  .ptab.active .ptag { background: rgba(255,255,255,.22); color: #fff; }

  /* 前三名领奖台 */
  .podium {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  .podium-card {
    border-radius: 14px;
    padding: 16px 12px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .podium-card .medal { font-size: 30px; line-height: 1; }
  .podium-card .name { font-weight: 700; font-size: 16px; margin-top: 7px; }
  .podium-card .score { font-weight: 700; font-size: 20px; margin-top: 2px; }
  .podium-card .best { font-size: 12px; color: var(--muted); margin-top: 5px; }

  /* 玩家搜索框 */
  .toolbar {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }
  .toolbar input {
    width: min(380px, 100%);
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  .toolbar input:focus { border-color: #b6bdcd; }
  .toolbar input::placeholder { color: #a6afc4; }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 22px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 12px;
    text-align: center;
  }
  .stat-card .num {
    font-size: 24px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .stat-card .label { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .stat-card.warn .num { color: var(--red-text); }

  .legend {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; }

  .table-wrap {
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 820px; font-variant-numeric: tabular-nums; }
  thead th {
    background: #f7f8fa;
    padding: 12px;
    font-weight: 600;
    font-size: 13px;
    color: #4a5364;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { background: #f0f2f6; }
  thead th .arrow { font-size: 11px; color: var(--muted); margin-left: 4px; }
  tbody td {
    padding: 11px 12px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr { transition: background .15s; }
  tbody tr:nth-child(even) { background: #fafbfd; }
  tbody tr:hover { background: #f2f4f9; }
  tbody tr:last-child td { border-bottom: none; }

  /* 缺刀红底 */
  tr.incomplete { background: var(--red-bg); }
  tr.incomplete:hover { background: #fbdcd7; }
  tr.incomplete td { border-bottom-color: var(--red-border); }
  .miss { color: #d9534f; font-weight: 600; }

  /* 排名徽章 */
  .rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    border-radius: 50%;
    font-weight: 600;
    color: #4a5364;
    background: #f1f3f6;
    font-size: 14px;
  }

  .player { font-weight: 600; }
  .total { font-weight: 700; }

  .boss-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    margin-left: 6px;
    vertical-align: middle;
    background: #f1f3f6;
    border: 1px solid #e3e7ef;
    color: #4a5364;
  }

  /* 三刀水备注 */
  .water {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    background: #f1f3f6;
    border: 1px solid #e3e7ef;
    color: #4a5364;
    font-weight: 600;
    font-size: 12px;
  }

  .incomplete-note {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--red-bg);
    border: 1px solid var(--red-border);
    color: var(--red-text);
    font-weight: 600;
    font-size: 13px;
  }

  /* 上一期排名列 */
  .prev-rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 34px;
    padding: 3px 8px;
    border-radius: 8px;
    font-weight: 600;
    background: #f1f3f6;
    color: #4a5364;
  }
  .prev-new {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 999px;
    background: #f1f3f6;
    border: 1px solid #e3e7ef;
    color: #4a5364;
    font-weight: 600;
    font-size: 12px;
  }

  /* 备注内排名变化小标签 */
  .note-change-up {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eef7f0;
    color: #2b8a3e;
    font-weight: 600;
    font-size: 12px;
  }
  .note-change-down {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #fdf0ef;
    color: #c0392b;
    font-weight: 600;
    font-size: 12px;
  }
  .note-box {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .badge-mini {
    font-size: 11px;
    padding: 2px 7px;
    vertical-align: middle;
    margin-left: 4px;
  }

  /* 已退盟（不在最新联盟名单，中性灰标注） */
  .gone-badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 999px;
    background: #f1f2f5;
    border: 1px solid #dcdfe6;
    color: #8a8f9c;
    vertical-align: middle;
    margin-left: 4px;
  }

  /* 访问人数（低调显示） */
  .visitor-count {
    position: fixed;
    right: 12px;
    bottom: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 11px;
    color: var(--muted);
    z-index: 50;
    opacity: .85;
  }

  /* 回到顶部按钮（默认隐藏，移动端滚动后显示） */
  .back-to-top {
    display: none;
    position: fixed;
    right: 16px;
    bottom: 70px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: #4a5364;
    cursor: pointer;
    z-index: 50;
    opacity: 0;
    transition: opacity .25s, transform .2s;
    transform: translateY(10px);
  }
  .back-to-top.show {
    display: flex;
    opacity: .95;
    transform: translateY(0);
  }
  .back-to-top:hover { background: #f2f4f9; transform: translateY(-2px); }

  @media (max-width: 768px) {
    .back-to-top.show { display: flex; }
  }

  /* 视图切换按钮 */
  .view-toggle {
    display: none;
    text-align: center;
    margin-bottom: 14px;
  }
  .view-toggle button {
    padding: 7px 18px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
  }
  .view-toggle button:hover { background: #f2f4f9; }

  /* 滑动提示 */
  .scroll-hint {
    display: none;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 6px;
    background: #f7f8fa;
    border-bottom: 1px solid var(--border);
    transition: opacity .3s;
  }

  /* 卡片视图 */
  .card-list {
    display: none;
    flex-direction: column;
    gap: 12px;
  }
  .player-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 14px 14px 19px;
    overflow: hidden;
  }
  .player-card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: #e3e7ef;
  }
  .player-card.incomplete { background: var(--red-bg); border-color: var(--red-border); }
  .player-card.incomplete::before { background: var(--red-border); }
  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--border);
  }
  .card-header .player { flex: 1; font-weight: 700; font-size: 16px; }
  .card-header .total { font-weight: 700; font-size: 17px; }
  .card-body {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 8px 14px;
    font-size: 13px;
    align-items: center;
  }
  .card-row { display: contents; }
  .card-row > span:first-child { color: var(--muted); text-align: left; }
  .card-row > span:last-child { text-align: right; }
  .card-row .note-box { justify-content: flex-end; }
  .card-row .sugar-comment { text-align: right; max-width: none; }

  /* 糖王锐评 */
  .sugar-comment {
    display: inline-block;
    max-width: 260px;
    padding: 8px 12px;
    border-radius: 10px;
    background: #fafafa;
    border: 1px solid #ececec;
    color: #57534e;
    font-size: 13px;
    line-height: 1.55;
    text-align: left;
    white-space: normal;
    word-break: break-word;
  }
  .sugar-comment::before { content: "🍬 "; }

  /* 移动端兼容 */
  @media (max-width: 768px) {
    body { padding: 12px; }
    .header { padding: 20px 12px 18px; border-radius: 12px; }
    .header h1 { font-size: 20px; letter-spacing: 1px; }
    .header .subtitle { font-size: 12px; }
    .period-tabs { gap: 8px; margin-bottom: 14px; }
    .ptab { padding: 7px 16px; font-size: 12px; }
    .ptab .ptag { font-size: 10px; padding: 1px 6px; }
    .stats-bar { grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
    .stat-card { padding: 10px 8px; }
    .stat-card .num { font-size: 19px; }
    .stat-card .label { font-size: 12px; }
    .podium { gap: 8px; margin-bottom: 14px; }
    .podium-card { padding: 12px 6px; border-radius: 12px; }
    .podium-card .medal { font-size: 24px; }
    .podium-card .name { font-size: 13px; }
    .podium-card .score { font-size: 16px; }
    .podium-card .best { font-size: 10px; }
    .legend { font-size: 11px; gap: 8px 12px; margin-bottom: 14px; }
    .view-toggle { display: block; }
    .scroll-hint { display: block; }
    .table-wrap { border-radius: 10px; }
    table { min-width: 900px; font-size: 12px; border-collapse: separate; border-spacing: 0; }
    thead th { padding: 8px 6px; font-size: 12px; }
    tbody td { padding: 8px 6px; }
    .rank { width: 26px; height: 26px; font-size: 12px; }
    .player { max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
    .sugar-comment { max-width: 180px; font-size: 12px; padding: 6px 9px; }
    .footer { font-size: 12px; }

    /* 表格视图下固定前3列，滑动时也能知道是谁 */
    thead th:nth-child(1), tbody td:nth-child(1) { position: sticky; left: 0; z-index: 2; background: #f7f8fa; }
    thead th:nth-child(2), tbody td:nth-child(2) { position: sticky; left: 38px; z-index: 2; background: #fff; }
    thead th:nth-child(3), tbody td:nth-child(3) { position: sticky; left: 86px; z-index: 2; background: #fff; }
    tbody tr:hover td:nth-child(1),
    tbody tr:hover td:nth-child(2),
    tbody tr:hover td:nth-child(3) { background: #f2f4f9; }
    tr.incomplete td:nth-child(1),
    tr.incomplete td:nth-child(2),
    tr.incomplete td:nth-child(3) { background: var(--red-bg); }
  }

  @media (max-width: 420px) {
    .header h1 { font-size: 18px; }
    .stats-bar { gap: 6px; }
    .stat-card { padding: 8px 6px; }
    .stat-card .num { font-size: 17px; }
    table { min-width: 820px; font-size: 11px; }
    .sugar-comment { max-width: 150px; font-size: 11px; }
  }

  .footer {
    margin-top: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }
  .footer .warn-box {
    background: var(--red-bg);
    border: 1px solid var(--red-border);
    border-radius: 12px;
    padding: 12px 20px;
    display: inline-block;
    text-align: left;
    color: var(--red-text);
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚔️ 工会战伤害统计 ⚔️</h1>
    <div class="subtitle" id="subtitle"></div>
  </div>

  <div class="period-tabs" id="period-tabs"></div>

  <div class="stats-bar">
    <div class="stat-card"><div class="num" id="stat-players">-</div><div class="label">👥 玩家总数</div></div>
    <div class="stat-card"><div class="num" id="stat-avg">-</div><div class="label">💥 平均总伤害</div></div>
    <div class="stat-card"><div class="num" id="stat-max">-</div><div class="label">🏆 最高总伤害</div></div>
    <div class="stat-card warn"><div class="num" id="stat-miss">-</div><div class="label">⚠️ 缺刀 / 未出刀</div></div>
  </div>

  <div class="podium" id="podium"></div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍 搜索玩家名 / 锐评关键词，快速定位" autocomplete="off">
  </div>

  <div class="legend" id="legend"></div>

  <div class="view-toggle">
    <button id="view-toggle-btn">📱 切换卡片视图</button>
  </div>

  <div class="table-wrap">
    <div class="scroll-hint" id="scroll-hint">← 左右滑动查看更多 →</div>
    <table id="tbl">
      <thead>
        <tr>
          <th data-key="rank">排名<span class="arrow"></span></th>
          <th data-key="prev">上一期排名<span class="arrow"></span></th>
          <th data-key="player">玩家名<span class="arrow"></span></th>
          <th data-key="total">总伤害(亿)<span class="arrow"></span></th>
          <th data-key="h1">第一刀<span class="arrow"></span></th>
          <th data-key="h2">第二刀<span class="arrow"></span></th>
          <th data-key="h3">第三刀<span class="arrow"></span></th>
          <th data-key="sugar">糖王锐评<span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="card-list" id="card-list"></div>

  <div class="footer">
    <div id="warn-list"></div>
    <div style="margin-top:10px">总伤害 = 三刀原始数值求和后再换算为亿（保留一位小数），避免分项四舍五入尾差</div>
    <div style="margin-top:6px;color:#a6afc4">点击顶部「第一期 / 第二期」按钮可切换查看各期数据，默认展示最新一期</div>
  </div>
</div>

<div class="visitor-count" id="visitor-count">👁 访问量 <span id="busuanzi_container_site_pv"><span id="busuanzi_value_site_pv">…</span></span></div>
<div class="back-to-top" id="back-to-top" title="回到顶部">↑</div>

<!-- 不蒜子访问统计（真实全站共享计数） -->
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
/* ==================== 多期数据 ====================
   新一期数据更新方法：
   1. 在 PERIODS 数组末尾新增一期对象（label / subtitle / waterBoss / data / sugarComments）
   2. data 每名玩家: { player, hits: [[Boss, 伤害原始值], ...] }
   3. "上一期排名"自动取自上一期榜单；改名玩家用 alias 做映射（当前名 -> 上期名）
   4. 页面默认展示数组中最后一期（最新一期）
==================================================== */
// 最新一期联盟在册名单（32/32，2026-09-13 截图核对）：
// 不在此名单中的历史玩家视为已退盟/被踢，网页用灰色「已退盟」标注区分
const ROSTER = new Set([
  "花绮妙", "千岛佳", "博哥儿", "云小溪", "KKK影",
  "行天游", "5MMM", "暗星", "指挥官", "辞忧",
  "非洲小萌新", "梦夜雨", "棱镜", "教官", "君情其情",
  "如遇", "派大星", "雪花", "青柠", "吃饱不想家",
  "德胜", "清蒸红烧LIYU", "南山", "厨厨厨", "绯色",
  "夜夜", "WAYNE", "苏沐瞳", "奈乐", "TRIGGER",
  "北冥虎纹鲨鱼", "希望",
]);

const PERIODS = [
  {
    id: 1,
    label: "第一期",
    subtitle: "本期数据与糖王锐评由行天游整理提供；三刀水（三刀均打铁匠）是高难 Boss，坚持出刀就值得鼓励 💪",
    waterBoss: "铁匠",
    data: [
      { player:"花绮妙", hits:[["火神R",9093677532],["铁匠",9563481571],["铁匠",9478513209]] },
      { player:"云小溪", hits:[["青瓜",5544549674],["重金属音乐",5793700105],["秘材H",10510510630]] },
      { player:"清蒸红烧LIYU", hits:[["秘材H",6969254440],["火神R",7290186157],["青瓜",5261158385]] },
      { player:"青柠", hits:[["秘材H",7413314892],["重金属音乐",4991063936],["青瓜",5925838400]] },
      { player:"千岛佳", hits:[["秘材H",6815863591],["铁匠",5506347714],["重金属音乐",5789533955]] },

const toYi = n => Math.round(n / 1e8 * 10) / 10;

// 预处理每一期
const processed = PERIODS.map(p => p.data.map(r => {
  const totalRaw = r.hits.reduce((s, h) => s + h[1], 0);
  const isWater = !!p.waterBoss && r.hits.length === 3 && r.hits.every(h => h[0] === p.waterBoss);
  const rosterKey = (p.alias && p.alias[r.player]) || r.player; // 改名玩家按旧名对名单
  return {
    player: r.player,
    hits: r.hits,
    totalRaw,
    totalYi: toYi(totalRaw),
    hitYi: r.hits.map(h => toYi(h[1])),
    isWater,
    count: r.hits.length,
    sugarComment: p.sugarComments[r.player] || "",
    gone: !ROSTER.has(rosterKey), // 已不在最新联盟名单
  };
}));

// 每期"按总伤害"的排名表（供下一期"上一期排名"回溯）
const rankMaps = processed.map(rows => {
  const sorted = [...rows].sort((a, b) => b.totalRaw - a.totalRaw);
  return new Map(sorted.map((r, i) => [r.player, i + 1]));
});

function getPrevRank(pi, player) {
  const p = PERIODS[pi];
  const key = (p.alias && p.alias[player]) || player;
  if (p.prevRank) return p.prevRank[key];        // 显式提供的历史排名
  if (pi > 0) return rankMaps[pi - 1].get(key);  // 自动取上一期名次
  return undefined;
}

function hitVal(r, idx) { return idx < r.hits.length ? r.hits[idx][1] : -1; }
function hitYiStr(r, idx) {
  if (idx >= r.hits.length) return '<span class="miss">— 缺</span>';
  const [boss, dmg] = r.hits[idx];
  const cls = "boss-" + boss.replace(/[^\u4e00-\u9fa5A-Za-z]/g, "");
  return `${toYi(dmg)}<span class="boss-tag ${cls}">${escHtml(boss)}</span>`;
}

function prevRankHtml(r, currentRank) {
  if (r.count === 0) {
    // 本期未出刀：不比较名次变化，仅显示上期排名 + 红字标注
    const prev = r.lastRank === undefined ? "" : `<span class="prev-rank">${r.lastRank}</span> `;
    return `${prev}<span class="miss">未出刀</span>`;
  }
  if (r.lastRank === undefined) return '<span class="prev-new">✨ 新</span>';
  const delta = r.lastRank - currentRank;
  let change = "";
  if (delta > 0) change = ` <span class="note-change-up">▲ 提升${delta}</span>`;
  else if (delta < 0) change = ` <span class="note-change-down">▼ 下降${-delta}</span>`;
  return `<span class="prev-rank">${r.lastRank}</span>${change}`;
}

function sugarHtml(r) {
  let text = r.sugarComment || "";
  // 三刀水玩家统一在锐评里带上"三刀水"文字；若原评语已含则避免重复
  if (r.isWater && !text.includes("三刀水")) {
    text = (text ? "三刀水，" + text : "三刀水");
  }
  if (!text) return "—";
  return `<span class="sugar-comment">${escHtml(text)}</span>`;
}

function escHtml(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function playerBadges(r) {
  let s = "";
  if (r.gone) s += ` <span class="gone-badge" title="已不在最新联盟 32 人在册名单">已退盟</span>`;
  if (r.count === 0) return s + ` <span class="incomplete-note badge-mini" title="本期未出刀">🔴 未出刀</span>`;
  if (r.count < 3) return s + ` <span class="incomplete-note badge-mini" title="缺 ${3 - r.count} 刀">🔴 缺${3 - r.count}</span>`;
  return s;
}

function renderLegend(p) {
  const items = [];
  if (p.waterBoss) items.push(`<span class="item"><span class="water">三刀水</span> = 三刀均打${p.waterBoss}</span>`);
  items.push('<span class="item"><span class="incomplete-note">🔴 缺刀</span> = 不足三刀（整行红底）</span>');
  items.push('<span class="item"><span class="miss">未出刀</span> = 联盟在册但本期一刀未打</span>');
  items.push('<span class="item"><span class="gone-badge">已退盟</span> = 已不在最新联盟 32 人在册名单</span>');
  items.push('<span class="item"><span class="prev-new">✨ 新</span> = 本期新入榜</span>');
  items.push('<span class="item"><span class="note-change-up">▲提升N</span> / <span class="note-change-down">▼下降N</span> 见上一期排名列</span>');
  $("legend").innerHTML = items.join("");
}

function renderTabs() {
  const order = PERIODS.map((p, i) => ({ p, i })).reverse(); // 最新一期排最前

  ).join("");
}

  const byTotal = [...rows].sort((a, b) => b.totalRaw - a.totalRaw);
  const rankMap = new Map(byTotal.map((r, i) => [r.player, i + 1]));

  let sorted = [...rows];
  sorted.sort((a, b) => {
    let va, vb;
    switch (sortKey) {
      case "rank": case "total": va = a.totalRaw; vb = b.totalRaw; break;
      case "prev":
        va = a.lastRank === undefined ? 999 : a.lastRank;
        vb = b.lastRank === undefined ? 999 : b.lastRank;
        break;
      case "player": va = a.player; vb = b.player; break;
      case "h1": va = hitVal(a,0); vb = hitVal(b,0); break;
      case "h2": va = hitVal(a,1); vb = hitVal(b,1); break;
      case "h3": va = hitVal(a,2); vb = hitVal(b,2); break;
      case "sugar": va = a.sugarComment; vb = b.sugarComment; break;
      default: va = a.totalRaw; vb = b.totalRaw;
    }
    let cmp;
    if (typeof va === "string") cmp = va.localeCompare(vb, "zh");
    else cmp = va - vb;
    return sortAsc ? cmp : -cmp;
  });

  // 搜索过滤（匹配玩家名或锐评内容）
  const visible = sorted.filter(r =>
    !searchTerm ||
    r.player.toLowerCase().includes(searchTerm) ||
    (r.sugarComment || "").toLowerCase().includes(searchTerm)
  );

  tbody.innerHTML = visible.map(r => {
    const rank = rankMap.get(r.player);
    const incomplete = r.count < 3;
    return `<tr class="${incomplete ? "incomplete" : ""}">
      <td><span class="rank">${rank}</span></td>
      <td>${prevRankHtml(r, rank)}</td>
      <td class="player">${escHtml(r.player)}${playerBadges(r)}</td>
      <td class="total">${r.totalYi.toFixed(1)}</td>
      <td>${hitYiStr(r,0)}</td>
      <td>${hitYiStr(r,1)}</td>
      <td>${hitYiStr(r,2)}</td>
      <td>${sugarHtml(r)}</td>
    </tr>`;
  }).join("");

  // 同时渲染卡片视图（可通过按钮切换）
  cardList.innerHTML = visible.map(r => {
    const rank = rankMap.get(r.player);
    const incomplete = r.count < 3;
    return `
      <div class="player-card ${incomplete ? "incomplete" : ""}">
        <div class="card-header">
          <span class="rank">${rank}</span>
          <span class="player">${escHtml(r.player)}${playerBadges(r)}</span>
          <span class="total">${r.totalYi.toFixed(1)}亿</span>
        </div>
        <div class="card-body">
          <div class="card-row"><span>上一期排名</span><span>${prevRankHtml(r, rank)}</span></div>
          <div class="card-row"><span>第一刀</span><span>${hitYiStr(r,0)}</span></div>
          <div class="card-row"><span>第二刀</span><span>${hitYiStr(r,1)}</span></div>
          <div class="card-row"><span>第三刀</span><span>${hitYiStr(r,2)}</span></div>
          <div class="card-row"><span>糖王锐评</span><span>${sugarHtml(r)}</span></div>
        </div>
      </div>
    `;
  }).join("");

  // 更新表头箭头
  document.querySelectorAll("#tbl thead th").forEach(th => {
    const arrow = th.querySelector(".arrow");
    arrow.textContent = th.dataset.key === sortKey ? (sortAsc ? "▲" : "▼") : "";
  });
}

function loadPeriod(idx) {
  curIdx = idx;
  const p = PERIODS[idx];
  rows = processed[idx].map(r => ({ ...r, lastRank: getPrevRank(idx, r.player) }));

  // 顶部说明 & 图例 & 期数按钮
  $("subtitle").textContent = p.subtitle;
  renderLegend(p);
  renderTabs();

  // 统计卡
  const players = rows.length;
  const avgYi = toYi(rows.reduce((s, r) => s + r.totalRaw, 0) / players);
  const maxYi = Math.max(...rows.map(r => r.totalYi));
  const missCount = rows.filter(r => r.count < 3).length;
  $("stat-players").textContent = players + " 人";
  $("stat-avg").textContent = avgYi + " 亿";
  $("stat-max").textContent = maxYi + " 亿";
  $("stat-miss").textContent = missCount + " 人";

  // 前三名领奖台
  const medals = ["🥇", "🥈", "🥉"];
  const top3 = [...rows].sort((a, b) => b.totalRaw - a.totalRaw).slice(0, 3);
  $("podium").innerHTML = top3.map((r, i) => {
    const best = [...r.hits].sort((a, b) => b[1] - a[1])[0];
    return `<div class="podium-card">
      <div class="medal">${medals[i]}</div>
      <div class="name">${escHtml(r.player)}</div>
      <div class="score">${r.totalYi.toFixed(1)} 亿</div>
      <div class="best">最高一刀 ${toYi(best[1])} 亿 · ${escHtml(best[0])}</div>
    </div>`;
  }).join("");

  // 缺刀提示（区分"完全未出刀"与"刀数不足"两组）
  const zeroRows = rows.filter(r => r.count === 0).sort((a, b) => (a.lastRank ?? 999) - (b.lastRank ?? 999));
  const partRows = rows.filter(r => r.count > 0 && r.count < 3).sort((a, b) => a.count - b.count);
  let warnHtml = "";
  if (zeroRows.length) {
    warnHtml += '⚠️ 以下联盟成员本期 <b>未出刀</b>：<br>' +
      zeroRows.map(r => {
        const prev = r.lastRank === undefined ? "" : `（上期第 ${r.lastRank} 名）`;
        return `&nbsp;&nbsp;• ${escHtml(r.player)}：0 刀 ${prev}`;
      }).join("<br>") + "<br>";
  }
  if (partRows.length) {
    warnHtml += (zeroRows.length ? '<br>' : '') +
      '⚠️ 以下玩家刀数不足三刀，可补充缺失数据：<br>' +
      partRows.map(r => `&nbsp;&nbsp;• ${escHtml(r.player)}：当前 <b>${r.count}</b> 刀`).join("<br>");
  }
  $("warn-list").innerHTML = warnHtml ? `<div class="warn-box">${warnHtml}</div>` : "";

  render();
}

document.querySelectorAll("#tbl thead th").forEach(th => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = key === "player"; }
    render();
  });
});

// 玩家搜索：输入即过滤表格与卡片
$("search").addEventListener("input", e => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});

// 视图切换
function applyView() {
  if (viewMode === "card") {
    tableWrap.style.display = "none";
    cardList.style.display = "flex";
    viewToggleBtn.textContent = "📊 切换表格视图";
  } else {
    tableWrap.style.display = "";
    cardList.style.display = "none";
    viewToggleBtn.textContent = "📱 切换卡片视图";
  }
  localStorage.setItem("gvg_view_mode", viewMode);
}
viewToggleBtn.addEventListener("click", () => {
  viewMode = viewMode === "card" ? "table" : "card";
  applyView();
});

// 滑动提示：滚动后自动淡出
tableWrap.addEventListener("scroll", () => {
  const hint = $("scroll-hint");
  if (hint) hint.style.opacity = "0";
}, { passive: true });

// 访问统计已改用不蒜子（busuanzi）真实计数服务，见页脚引入的脚本

// 回到顶部按钮（仅在移动端显示）
const backToTop = $("back-to-top");
window.addEventListener("scroll", () => {
  if (window.innerWidth <= 768 && window.scrollY > 400) {
    backToTop.classList.add("show");
  } else {
    backToTop.classList.remove("show");
  }
}, { passive: true });
backToTop.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});

loadPeriod(PERIODS.length - 1);
applyView();
</script>
</body>
</html>
